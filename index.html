<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080b12" />
    <!-- Ohne dieses Tag kennt der Browser das Manifest nicht — "Zum
         Home-Bildschirm hinzufügen" fällt dann auf ein reines Lesezeichen
         zurück statt eine installierbare/standalone PWA anzubieten (fehlte
         hier bis 2026-08-23, siehe fitness-dev/index.html als Referenz, wo
         der Tag von Anfang an vorhanden war). -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Fuel" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fraunces (Ticket-Kicker/Journal-Display) + Space Mono (Kücheziffern) —
         nur für den Log-Tab, Rest der App bleibt bei Inter. -->
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,900;1,9..144,500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
    <title>Fuel Centre</title>
    <script src="/offline-queue.js"></script>
    <script type="module" src="/src/client/main.jsx"></script>
  </head>
  <body class="bg-slate-950 text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/client/registerSW.js"></script>
  </body>
</html>
