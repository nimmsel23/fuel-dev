# Preview-Deploy für Fuel: dev-Push → 24h-Channel "dev", PR → eigener PR-Channel.
#
# Fuel braucht für Shared-Stubs das private fitness-backend (fuel/src/shared) als
# Geschwister backend/ neben fuel-dev/ — analog lokal ~/dev/backend. Kein vitalos-Meta.
# Telegram-Link kommt wie bei der lokalen Pipeline (scripts/deploy-preview.mjs).

name: Preview (Fuel dev)

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'vite.config.*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/preview-dev.yml'
  pull_request:
    branches: [master, dev]
    paths:
      - 'src/**'
      - 'vite.config.*'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  preview:
    runs-on: ubuntu-latest
    # PR-Kommentar mit Preview-URL (Firebase-Action) braucht pull-requests: write
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - name: Checkout fuel-dev
        uses: actions/checkout@v4
        with:
          path: fuel-dev

      - name: Checkout fitness-backend (shared SOT)
        uses: actions/checkout@v4
        with:
          repository: nimmsel23/fitness-backend
          ref: dev
          path: backend
          token: ${{ secrets.SYNC_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fuel-dev/pnpm-lock.yaml

      - name: Install
        working-directory: fuel-dev
        run: pnpm install --frozen-lockfile

      - name: Build Fuel (Cloud)
        working-directory: fuel-dev
        run: pnpm run build:cloud
        env:
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY || secrets.VITE_RECAPTCHA_SITE_KEY }}

      - name: Deploy Preview Channel
        id: firebase_deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          entryPoint: fuel-dev
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: fitness-aos
          # firebase.json kennt fünf Hosting-Targets (Haupt-App + vier Mini-Apps) — Preview nur für die Haupt-App.
          target: client
          channelId: ${{ github.event_name != 'pull_request' && 'dev' || '' }}
          expires: 24h

      - name: Telegram-Link senden
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 Preview für Fuel (${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || 'dev' }}) gebaut!

            🔗 ${{ steps.firebase_deploy.outputs.details_url }}
            ⏱️ Gültig 24h.

            Commit: ${{ github.event.pull_request.title || github.event.head_commit.message }}
