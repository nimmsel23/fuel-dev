# Preview-Deploy für Fuel: dev-Push → 24h-Channel "dev", PR → eigener PR-Channel.
#
# Fuel ist eigenständig: keine Imports aus Nachbar-Repos (fitness/journal/habits/relax),
# der Build läuft aus einem nackten Checkout dieses Repos — kein vitalos-Meta-Repo,
# keine Submodule, keine privaten Fremd-Repos nötig.
# Telegram-Link kommt wie bei der lokalen Pipeline (scripts/deploy-preview.mjs).

name: Preview (Fuel dev)

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'src/**'
      - 'vite.config.*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/preview-dev.yml'
  pull_request:
    branches: [vitalos, master, dev]
    paths:
      - 'src/**'
      - 'vite.config.*'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  preview:
    runs-on: ubuntu-latest
    # PR-Kommentar mit Preview-URL (Firebase-Action) braucht pull-requests: write
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build Fuel (Cloud)
        run: pnpm run build:cloud

      - name: Deploy Preview Channel
        id: firebase_deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: fitness-aos
          # firebase.json kennt fünf Hosting-Targets (Haupt-App + vier Mini-Apps) — Preview nur für die Haupt-App.
          target: client
          channelId: ${{ github.event_name != 'pull_request' && 'dev' || '' }}
          expires: 24h

      - name: Telegram-Link senden
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 Preview für Fuel (${{ github.event_name == 'pull_request' && format('PR #{0}', github.event.pull_request.number) || 'dev' }}) gebaut!

            🔗 ${{ steps.firebase_deploy.outputs.details_url }}
            ⏱️ Gültig 24h.

            Commit: ${{ github.event.pull_request.title || github.event.head_commit.message }}
