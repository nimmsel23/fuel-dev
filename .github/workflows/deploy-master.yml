# Standalone-Prod Fuel: Push auf master deployt live (nur CI) — aus dem eigenen
# Repo + backend (Shared-Stubs unter src/shared → ../../../../backend/fuel/...).
# Kein vitalos-Meta, keine Fitness-KB, keine Nachbar-Repos (seit Standalone 2026-10).
#
# Auslöser: push auf master und workflow_dispatch (automerge.yml) -> baut und deployt live (nur master).
# Push auf `ci-test/**` -> reiner Build-Test, KEIN Deploy.
# Shell-Pin im Meta-Repo bleibt bewusst: Pointer-Bump via vos-release/vos-ship.

name: Live Deploy (Fuel master)

'on':
  workflow_dispatch:
    inputs:
      deploy:
        description: "Live deployen? (nur auf master wirksam; false = nur bauen)"
        type: boolean
        default: true
  push:
    branches:
      - master
      - 'ci-test/**'

concurrency:
  group: live-fuel-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    # dependabot[bot] hat kein SYNC_TOKEN. Job bleibt aus, inklusive Checkout
    # backend, Build und Firebase-Deploy. Andere Actors unverändert.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DO_DEPLOY: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || inputs.deploy) }}
    steps:
      - name: Checkout fuel-dev
        uses: actions/checkout@v4
        with:
          path: fuel-dev
          # Volle Historie: der Changelog (scripts/vos-changelog) liest bei workflow_dispatch `git log <parent>..HEAD`.
          fetch-depth: 0

      - name: Checkout backend (shared SOT)
        if: github.actor != 'dependabot[bot]'
        uses: actions/checkout@v4
        with:
          repository: nimmsel23/backend
          # Shared liegt auf dev; main ist divergiert/ohne fuel/src/shared.
          ref: dev
          path: backend
          token: ${{ secrets.SYNC_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fuel-dev/pnpm-lock.yaml

      - name: Install (fuel-dev, eigener Lockfile)
        working-directory: fuel-dev
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Firebase config schreiben
        env:
          FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          if [ -n "$FIREBASE_CONFIG" ]; then
            printf '%s\n' "$FIREBASE_CONFIG" > fuel-dev/src/client/lib/firebase.config.js
          fi

      - name: Build Fuel
        working-directory: fuel-dev
        run: pnpm run build:cloud
        env:
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY || secrets.VITE_RECAPTCHA_SITE_KEY }}

      - name: Deploy Fuel to Firebase Hosting
        if: env.DO_DEPLOY == 'true'
        working-directory: fuel-dev
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" \
            npx firebase-tools@latest deploy --only hosting:client,hosting:alias \
            --project fitness-aos --non-interactive
