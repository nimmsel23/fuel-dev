# Standalone-Prod Fuel: Push auf master deployt live (nur CI). Gleiche Schritte wie das frühere
# Meta-Repo-Workflow deploy-fuel.yml; das Meta-Repo liefert nur die Nachbar-Repos (Cross-Repo-Aliase),
# fuel-app wird auf den ausgelösten Commit gesetzt.

name: Live Deploy (Fuel master)
'on':
  workflow_dispatch: null
  push:
    branches:
    - master
concurrency:
  group: live-fuel-master
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout vitalos (Meta-Repo, liefert Nachbar-Repos)
      uses: actions/checkout@v4
      with:
        repository: nimmsel23/vitalos
        ref: master
    - name: Private Skills submodule access
      uses: ./.github/actions/skills-submodule-auth
      with:
        deploy-key: ${{ secrets.SKILLS_DEPLOY_KEY }}
    - name: Submodules via HTTPS + Token
      run: |
        git config --global url."https://x-access-token:${{ secrets.GH_SUBMODULE_TOKEN || secrets.GITHUB_TOKEN }}@github.com/".insteadOf "git@github.com:"
        git submodule sync
        git submodule update --init --recursive
    - name: fuel-app auf den ausgelösten Commit setzen
      run: |
        cd fuel-app
        SHA="${{ github.sha }}"
        git fetch origin "$SHA"
        git checkout "$SHA"
    - uses: pnpm/action-setup@v4
      with:
        version: 11.3.0
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
    - name: Install (Workspaces)
      run: pnpm install --no-frozen-lockfile
    - name: Generate fitness KB data (transitive dependency via journal→habits)
      run: pnpm --filter ./fitness-app run build:kb-data
    - name: Firebase config schreiben
      run: |
        if [ -n "$FIREBASE_CONFIG" ]; then
          echo "$FIREBASE_CONFIG" > fuel-app/src/client/lib/firebase.config.js
        fi
      env:
        FIREBASE_CONFIG: ${{ secrets.FIREBASE_CONFIG }}
    - name: Build Fuel
      run: pnpm --filter ./fuel-app run build:cloud
      env:
        VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY || secrets.VITE_RECAPTCHA_SITE_KEY }}
    - name: Deploy Fuel to Firebase Hosting
      run: |
        cd fuel-app
        echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT || secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS }}' > /tmp/sa.json
        GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json \
          npx firebase-tools@latest deploy --only hosting:client \
          --project fitness-aos --non-interactive
