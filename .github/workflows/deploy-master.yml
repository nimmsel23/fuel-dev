# Live-Deploy für Fuel: Push auf master
#
# Baut die App und lädt sie direkt live auf Firebase hoch (Hosting-Target "fuelos" = Site fuel-os, https://fuel-os.web.app).
# Fuel ist eigenständig (keine Imports aus Nachbar-Repos): nackter Checkout dieses Repos,
# kein vitalos-Meta-Repo, keine Submodule.

name: Live Deploy (Fuel master)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'vite.config.*'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-master.yml'

jobs:
  deploy_live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build Fuel (Live)
        run: pnpm run build:cloud

      - name: Deploy Live
        id: firebase_deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FITNESS_AOS || secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: fitness-aos
          # firebase.json kennt mehrere Hosting-Targets — master geht auf die Site fuel-os (Target "fuelos").
          # fuel-vos (Target "client") bedient die vitalos-Pipeline ("Deploy Fuel PWA"), die Mini-Apps werden
          # bewusst nur manuell deployt (pnpm run deploy:solo:<x>).
          target: fuelos
          channelId: live

      - name: Telegram-Benachrichtigung senden
        if: success()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            🚀 Fuel ist LIVE deployed (master)!

            🔗 Live-URL: https://fuel-os.web.app

            Commit: ${{ github.event.head_commit.message }}
