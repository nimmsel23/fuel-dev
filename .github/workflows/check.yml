# Check für Fuel: Build auf jedem PR/dev-Push, ohne Deploy und ohne Firebase-Secrets.
#
# Shared-SOT liegt in nimmsel23/backend (fuel/src/shared); die Stubs unter
# src/shared/* re-exporten nach ../../../../backend/fuel/... — deshalb Checkout als
# Geschwister fuel-dev/ + backend/ (wie lokal ~/dev/fuel-dev neben ~/dev/backend).

name: Check (Fuel)

on:
  workflow_dispatch:
  push:
    branches: [dev]
  pull_request:
    branches: [master, dev]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout fuel-dev
        uses: actions/checkout@v4
        with:
          path: fuel-dev

      - name: Checkout backend (shared SOT)
        uses: actions/checkout@v4
        with:
          repository: nimmsel23/backend
          ref: dev
          path: backend
          token: ${{ secrets.SYNC_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fuel-dev/pnpm-lock.yaml

      - name: Install
        working-directory: fuel-dev
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        working-directory: fuel-dev
        run: pnpm run test:unit

      - name: Tooling (Biome format scripts/)
        working-directory: fuel-dev
        run: pnpm run tooling:biome

      - name: Tooling (knip report)
        working-directory: fuel-dev
        continue-on-error: true
        run: pnpm run tooling:knip

      - name: Build Fuel (Cloud)
        working-directory: fuel-dev
        run: pnpm run build:cloud
        env:
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY || secrets.VITE_RECAPTCHA_SITE_KEY }}
