# Check für Fuel: Build auf jedem PR/dev-Push, ohne Deploy und ohne Firebase-Secrets.
#
# Shared-SOT liegt in nimmsel23/backend (fuel/src/shared); die Stubs unter
# src/shared/* re-exporten nach ../../../../backend/fuel/... — deshalb Checkout als
# Geschwister fuel-dev/ + backend/ (wie lokal ~/dev/fuel-dev neben ~/dev/backend).
#
# Dependabot-PRs bekommen keine Actions-Secrets (CI.md S7) → SYNC_TOKEN fehlt und
# der Checkout von nimmsel23/backend bricht. Für dependabot[bot] wird genau dieser
# Checkout übersprungen. Unit-Tests und der Cloud-Build laufen weiter; die Stubs
# unter src/shared zeigen auf ../backend/fuel/src/shared, deshalb legt der Lauf
# den letzten in diesem Repo liegenden Shared-Stand daneben (7795f299). Der volle
# Check gegen das private Backend bleibt der Push/Dispatch auf dev.

name: Check (Fuel)

on:
  workflow_dispatch:
  push:
    branches: [dev]
  pull_request:
    branches: [master, dev]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout fuel-dev
        uses: actions/checkout@v4
        with:
          path: fuel-dev

      - name: Checkout backend (shared SOT)
        if: github.actor != 'dependabot[bot]'
        uses: actions/checkout@v4
        with:
          repository: nimmsel23/backend
          ref: dev
          path: backend
          token: ${{ secrets.SYNC_TOKEN }}

      # Dependabot hat kein SYNC_TOKEN. Ohne die Shared-Dateien scheitern Unit-Tests
      # und der Cloud-Build an den Re-Exports. 7795f299 ist der letzte Commit, in dem
      # src/shared noch Quelltext in diesem Repo war (Parent von 9b017ad).
      - name: Shared-SOT für Dependabot (ohne privates Backend)
        if: github.actor == 'dependabot[bot]'
        working-directory: fuel-dev
        run: |
          set -euo pipefail
          rev=7795f299a35d3ce97273f14ea9c1844a2fd2a9e2
          if ! git fetch --depth=1 origin "$rev"; then
            base="${GITHUB_BASE_REF:-dev}"
            git fetch --depth=300 origin "$base"
          fi
          mkdir -p "$GITHUB_WORKSPACE/backend/fuel"
          git archive "$rev" src/shared | tar -x -C "$GITHUB_WORKSPACE/backend/fuel"
          dach="$GITHUB_WORKSPACE/backend/fuel/src/shared/config/dach.mjs"
          test -s "$dach"
          if grep -q 'export \* from' "$dach"; then
            echo "::error::Shared-Snapshot $rev ist ein Re-Export, kein Quellstand"
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: fuel-dev/pnpm-lock.yaml

      - name: Install
        working-directory: fuel-dev
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        working-directory: fuel-dev
        run: pnpm run test:unit

      - name: Tooling (Biome format scripts/)
        working-directory: fuel-dev
        run: pnpm run tooling:biome

      - name: Tooling (knip report)
        working-directory: fuel-dev
        continue-on-error: true
        run: pnpm run tooling:knip

      - name: Build Fuel (Cloud)
        working-directory: fuel-dev
        run: pnpm run build:cloud
        env:
          VITE_RECAPTCHA_SITE_KEY: ${{ vars.VITE_RECAPTCHA_SITE_KEY || secrets.VITE_RECAPTCHA_SITE_KEY }}

      - name: Dependabot — functions lockfile
        if: github.actor == 'dependabot[bot]'
        working-directory: fuel-dev/functions
        run: npm ci
